[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ticket-csv-cleaner"
version = "1.0.0"
description = "A typed CLI for validating and cleaning Service Desk CSV exports."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ticket-csv-cleaner contributors" }]
keywords = ["csv", "service-desk", "data-quality", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "charset-normalizer==3.4.9",
  "Jinja2==3.1.6",
  "pydantic==2.13.4",
  "python-dateutil==2.9.0.post0",
  "PyYAML==6.0.3",
  "typer==0.27.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
  "types-python-dateutil==2.9.0.20260716",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
ticket-csv-cleaner = "ticket_csv_cleaner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_csv_cleaner"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PTH",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "charset_normalizer.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests involving filesystem and complete processing flows",
]

[tool.coverage.run]
branch = true
source = ["ticket_csv_cleaner"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
